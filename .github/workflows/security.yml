name: Security checks

on:
  pull_request:
  push:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install application and audit tool
        run: |
          python -m pip install --upgrade "pip>=26.2,<27"
          python -m pip install -r requirements-dev.txt "pip-audit==2.10.1"
          python -m pip check
      - name: Check known package vulnerabilities
        run: python -m pip_audit --progress-spinner off
      - name: Check security regressions
        run: python -m pytest -q tests/test_security.py tests/test_trade_stores.py tests/test_web_auth.py tests/test_citizen_updates.py
