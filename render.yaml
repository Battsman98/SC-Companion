databases:
  - name: star-citizen-game-assist-db
    plan: basic-256mb
    region: oregon
    databaseName: game_assist
    user: game_assist
    diskSizeGB: 1
    storageAutoscalingEnabled: false

services:
  - type: web
    name: star-citizen-game-assist
    runtime: python
    plan: 2c-4g
    region: oregon
    buildCommand: pip install -r requirements-web.txt
    startCommand: python -m uvicorn src.web:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - web/**
        - data/**
        - src/web.py
        - src/web_auth.py
        - src/cache.py
        - src/config.py
        - src/postgres_compat.py
        - src/security.py
        - src/shared.py
        - src/timers.py
        - src/sources/**
        - requirements-common.txt
        - requirements-web.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        fromDatabase:
          name: star-citizen-game-assist-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: UEX_API_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: PUBLIC_DISCORD_CLIENT_ID
        value: "1546598117611405384"
      - key: PUBLIC_DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: WEB_SESSION_SECRET
        generateValue: true
      - key: WEB_ADMIN_TOKEN
        generateValue: true
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: FEEDBACK_FORUM_CHANNEL_ID
        value: "1533026212463775754"
      - key: HTTP_TIMEOUT_SECONDS
        value: "15"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: DATABASE_STORAGE_LIMIT_BYTES
        value: "1073741824"
      - key: INVENTORY_SCANNER_WORKERS
        value: "1"
      - key: INVENTORY_SCANNER_CAPACITY
        value: "4"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: WEB_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: TRUSTED_ORIGINS
        value: "https://star-citizen-game-assist.onrender.com"

  - type: worker
    name: star-citizen-game-assist-discord
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements-bot.txt
    startCommand: python -m src.bot
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - docs/**
        - data/**
        - src/bot.py
        - src/cache.py
        - src/config.py
        - src/postgres_compat.py
        - src/security.py
        - src/shared.py
        - src/timers.py
        - src/sources/**
        - requirements-bot.txt
        - requirements-common.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        fromDatabase:
          name: star-citizen-game-assist-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: UEX_API_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: COMMANDS_CHANNEL_ID
        sync: false
      - key: EXEC_STATUS_CHANNEL_ID
        sync: false
      - key: EXEC_ADMIN_ROLE_IDS
        sync: false
      - key: BOT_ADMIN_ROLE_IDS
        sync: false
      - key: BOT_ADMIN_USER_IDS
        sync: false
      - key: CZ_TIMERS_CHANNEL_ID
        sync: false
      - key: AUDIT_LOG_CHANNEL_ID
        sync: false
      - key: FEEDBACK_FORUM_CHANNEL_ID
        value: "1533026212463775754"
      - key: TRADING_FORUM_CHANNEL_ID
        value: "1544467298046320711"
      - key: COMMAND_CHANNEL_IDS
        sync: false
      - key: BOT_COMMAND_PREFIX
        value: "!"
      - key: HTTP_TIMEOUT_SECONDS
        value: "15"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: DISCORD_RATE_LIMIT_PER_10_SECONDS
        value: "8"

  - type: worker
    name: sc-companion-discord
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements-bot.txt
    startCommand: python -m src.bot
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - docs/**
        - data/**
        - src/bot.py
        - src/cache.py
        - src/config.py
        - src/guild_config.py
        - src/postgres_compat.py
        - src/security.py
        - src/shared.py
        - src/timers.py
        - src/sources/**
        - requirements-bot.txt
        - requirements-common.txt
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        fromDatabase:
          name: star-citizen-game-assist-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: BOT_APPROVAL_AUTHORITY
        value: "false"
      - key: BOT_RUNTIME_PROFILE
        value: public
      - key: UEX_API_TOKEN
        sync: false
